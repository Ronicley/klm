        choices:
            - approved
    e3a56a4b-7375-41f6-a138-80c304dd5715:
        type: terminal
        name: Update repo
        command: git pull
choices:
    approved:
        name: approved
        input: {}
        output: {}
        to: 29a4300d-c79c-4686-8737-7ee6897acdbb
    blocked:
        name: blocked
        input:
            reason:
                type: string
                required: true
        output: {}
        terminal: true
    done:
        name: done
        input: {}
        output: {}
        terminal: true
    needs-adjustements:
        name: needs_adjustements
        input:
            findings:
                type: string
                required: true
        output:
            task: Você precisa ajustar as seguintes falhas:{{choice.findings}}
        to: 4d8bdf5b-f543-4ca6-9f75-a9bac948ac86
        session: continue_target
    work-done:
        name: work_done
        input:
            summary:
                type: string
