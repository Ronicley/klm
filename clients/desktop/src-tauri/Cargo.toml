[package]
name = "klm-desktop"
version = "0.6.0"
description = "KLM interface for coding-agent harnesses"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
keyring = { version = "3", features = ["windows-native"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
