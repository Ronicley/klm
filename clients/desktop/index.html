<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('klm.theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      try {
        const mode = document.documentElement.dataset.theme;
        const variants = mode === 'dark' ? ['onyx', 'slate', 'dusk'] : ['pearl', 'sand', 'mist'];
        const saved = JSON.parse(localStorage.getItem('klm.theme-variants.v1') || 'null');
        document.documentElement.dataset.themeVariant = variants.includes(saved?.[mode]) ? saved[mode] : variants[0];
      } catch { /* Default palettes also work without a saved variant. */ }
    </script>
    <title>KLM | Agent Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
