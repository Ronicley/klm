name: klm_harness
description: "KLM Harness mobile host launcher."
publish_to: 'none'
version: 0.5.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  record: ^7.1.2
  path_provider: ^2.1.5
  network_info_plus: ^8.2.2
  permission_handler: ^12.0.1
  wifi_scan: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon.png
    - assets/brand/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  background_color_ios: '#f6f7f8'
  adaptive_icon_background: '#f6f7f8'
  adaptive_icon_foreground: assets/brand/icon.png
